name: Seans dışı izleme

on:
  schedule:
    # UTC, every 30 minutes around the pre-market (04:00-09:30 ET) and after-hours (16:00-20:00 ET)
    # windows in both summer and winter time; the first step exits at once outside those windows.
    - cron: "7,37 0,1,8-14,20-23 * * 1-6"
  workflow_dispatch:
    inputs:
      force:
        description: "Saat dışında da bir kez çalıştır (deneme)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: extended-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Seans dışı saat mi?
        id: s
        run: |
          now=$(TZ=America/New_York date +%u%H%M)
          dow=${now:0:1}; hm=$((10#${now:1:4}))
          ok=0
          if [ "$dow" -le 5 ] && (( (hm >= 400 && hm < 930) || (hm >= 1600 && hm <= 2005) )); then ok=1; fi
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.s.outputs.ok == '1' || inputs.force
      - uses: actions/setup-python@v5
        if: steps.s.outputs.ok == '1' || inputs.force
        with:
          python-version: "3.12"
          cache: pip
      - name: Bağımlılıkları kur
        if: steps.s.outputs.ok == '1' || inputs.force
        run: pip install -r requirements.txt
      - name: Seans dışı fiyatları al
        if: steps.s.outputs.ok == '1' || inputs.force
        env:
          BOT_FORCE: ${{ inputs.force && '1' || '0' }}
        run: |
          python watch.py
          git config user.name "portfoy-bot"
          git config user.email "portfoy-bot@users.noreply.github.com"
          git add extended.json 2>/dev/null || exit 0
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "İzleme: $(TZ=America/New_York date '+%Y-%m-%d %H:%M') ET"
          for i in 1 2 3; do
            if git pull -q --rebase && git push -q; then exit 0; fi
            sleep 10
          done
          echo "::warning::İzleme sonucu gönderilemedi"
