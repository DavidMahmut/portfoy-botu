name: Nasdaq hareketliler

on:
  schedule:
    # every hour during the session and once after the close (UTC; New York is UTC-5 from 1 Nov to 8 Mar)
    - cron: "40 14-20 * * 1-5"
    - cron: "25 21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: movers
  cancel-in-progress: false

jobs:
  movers:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt requests lxml
      - name: Hareketlileri tara
        run: python movers.py
      - name: Yüzde 20 bildirimi
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f alerts_new.md ]; then
            gh issue create --title "$(head -n1 alerts_new.md)" --body-file alerts_new.md || echo "::warning::bildirim açılamadı"
            rm -f alerts_new.md
          fi
      - name: Sonucu kaydet
        run: |
          git config user.name "portfoy-bot"
          git config user.email "portfoy-bot@users.noreply.github.com"
          git add movers.json fundamentals.json 2>/dev/null || git add movers.json
          git commit -q -m "Hareketliler: $(TZ=America/New_York date +'%Y-%m-%d %H:%M') ET" || exit 0
          for i in 1 2 3; do
            if git pull -q --rebase && git push -q; then exit 0; fi
            sleep 10
          done
