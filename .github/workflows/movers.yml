name: Nasdaq hareketliler

on:
  # The bot's loop (bot.yml) starts this scan every hour at xx:40 New York time and once at 16:10, because GitHub's
  # own schedule here was often hours late or skipped. The schedule below is only a backup after the close
  # (UTC: 16:40 New York in winter, 17:40 in summer); a run on a day already emailed sends nothing new.
  schedule:
    - cron: "40 21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: movers
  cancel-in-progress: false

jobs:
  movers:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt requests lxml
      - name: Hareketlileri tara
        run: python movers.py
      - name: Bildirimler (düşüp dengelenen + günlük %20 özeti)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for f in rebound_new.md alerts_new.md; do
            if [ -f "$f" ]; then
              gh issue create --title "$(head -n1 "$f")" --body-file "$f" || echo "::warning::bildirim açılamadı ($f)"
              rm -f "$f"
            fi
          done
      - name: Sonucu kaydet
        run: |
          git config user.name "portfoy-bot"
          git config user.email "portfoy-bot@users.noreply.github.com"
          git add movers.json fundamentals.json 2>/dev/null || git add movers.json
          git commit -q -m "Hareketliler: $(TZ=America/New_York date +'%Y-%m-%d %H:%M') ET" || exit 0
          for i in 1 2 3; do
            if git pull -q --rebase && git push -q; then exit 0; fi
            sleep 10
          done
