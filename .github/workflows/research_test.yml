name: Sabah araştırması denemesi

on:
  workflow_dispatch:
    inputs:
      at:
        description: "Hangi günün açılışı gibi (New York saati), ör. 2026-11-25T09:31"
        type: string
        default: "2026-11-25T09:31"

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Araştırmayı çalıştır
        env:
          RESEARCH_AT: ${{ inputs.at }}
        run: time python research.py
      - name: Sonucu kaydet
        if: always()
        run: |
          git config user.name "portfoy-bot"
          git config user.email "portfoy-bot@users.noreply.github.com"
          [ -f picks_test.json ] || exit 0
          git add picks_test.json
          git commit -q -m "Sabah araştırması denemesi" || exit 0
          for i in 1 2 3; do
            if git pull -q --rebase && git push -q; then exit 0; fi
            sleep 10
          done
