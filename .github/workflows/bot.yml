name: Portföy botu

on:
  schedule:
    # UTC; covers 09:30–16:00 New York in both summer (EDT) and winter (EST) time.
    - cron: "*/15 13-21 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "Piyasa kapalıyken de çalıştır (deneme)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: trader
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Piyasa saati mi?
        id: hours
        run: |
          now=$(TZ=America/New_York date +%u%H%M)
          dow=${now:0:1}; hm=$((10#${now:1:4}))
          if [ "$dow" -le 5 ] && [ "$hm" -ge 930 ] && [ "$hm" -le 1610 ]; then echo "open=1" >> "$GITHUB_OUTPUT"; else echo "open=0" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.hours.outputs.open == '1' || inputs.force
      - uses: actions/setup-python@v5
        if: steps.hours.outputs.open == '1' || inputs.force
        with:
          python-version: "3.12"
          cache: pip
      - name: Bağımlılıkları kur
        if: steps.hours.outputs.open == '1' || inputs.force
        run: pip install -r requirements.txt
      - name: Botu çalıştır
        if: steps.hours.outputs.open == '1' || inputs.force
        env:
          BOT_FORCE: ${{ inputs.force && '1' || '0' }}
        run: python trader.py
      - name: Sonuçları kaydet
        if: steps.hours.outputs.open == '1' || inputs.force
        run: |
          git config user.name "portfoy-bot"
          git config user.email "portfoy-bot@users.noreply.github.com"
          git add ledger.json
          if git diff --cached --quiet; then echo "Değişiklik yok"; exit 0; fi
          git commit -m "Bot: $(TZ=America/New_York date '+%Y-%m-%d %H:%M') ET"
          git pull --rebase
          git push
