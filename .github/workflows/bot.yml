name: Portföy botu

on:
  schedule:
    # UTC. Each trigger starts a loop that runs the bot every 5 minutes until the US market
    # closes. GitHub can delay or drop scheduled triggers, so there is one every 15 minutes
    # as a backup; a trigger that finds a loop already running exits within seconds.
    - cron: "2,17,32,47 13-20 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "Piyasa kapalıyken de bir kez çalıştır (deneme)"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write   # the loop starts the Nasdaq movers scan (movers.yml) itself; GitHub's schedule for it is unreliable

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Piyasa açık mı, döngü zaten çalışıyor mu?
        id: hours
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          now=$(TZ=America/New_York date +%u%H%M)
          dow=${now:0:1}; hm=$((10#${now:1:4}))
          open=0
          if [ "$dow" -le 5 ] && [ "$hm" -ge 925 ] && [ "$hm" -le 1600 ]; then open=1; fi
          older=$(gh run list --workflow bot.yml --status in_progress --json databaseId \
                    --jq "map(select(.databaseId < ${GITHUB_RUN_ID})) | length" 2>/dev/null || echo 0)
          busy=0
          if [ "${older:-0}" != "0" ]; then busy=1; open=0; echo "Bir döngü zaten çalışıyor; bu tetikleme çıkıyor."; fi
          echo "open=$open" >> "$GITHUB_OUTPUT"
          echo "busy=$busy" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.hours.outputs.open == '1' || (inputs.force && steps.hours.outputs.busy == '0')
      - uses: actions/setup-python@v5
        if: steps.hours.outputs.open == '1' || (inputs.force && steps.hours.outputs.busy == '0')
        with:
          python-version: "3.12"
          cache: pip
      - name: Bağımlılıkları kur
        if: steps.hours.outputs.open == '1' || (inputs.force && steps.hours.outputs.busy == '0')
        run: pip install -r requirements.txt
      - name: Botu çalıştır (kapanışa kadar 5 dakikada bir)
        if: steps.hours.outputs.open == '1' || (inputs.force && steps.hours.outputs.busy == '0')
        env:
          BOT_FORCE: ${{ inputs.force && '1' || '0' }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          git config user.name "portfoy-bot"
          git config user.email "portfoy-bot@users.noreply.github.com"
          save() {
            git add ledger.json
            if git diff --cached --quiet; then return 1; fi
            git commit -q -m "Bot: $(TZ=America/New_York date '+%Y-%m-%d %H:%M') ET"
            for i in 1 2 3; do
              if git pull -q --rebase && git push -q; then return 0; fi
              sleep 10
            done
            echo "::warning::Sonuçlar gönderilemedi"
            return 1
          }
          deadline=$((SECONDS + 345 * 60))
          last_save=$SECONDS
          saved_once=0
          mv_hour=""
          news_slot=""
          while true; do
            python trader.py || echo "::warning::trader.py hata verdi"
            # save at once on the first market run (so the page shows the bot is up),
            # then every ~10 minutes, and immediately after any trade
            if [ -f .traded ] || [ "$saved_once" = 0 ] || [ $((SECONDS - last_save)) -ge 590 ]; then
              if save; then saved_once=1; last_save=$SECONDS; fi
              rm -f .traded
            fi
            if [ "$BOT_FORCE" = "1" ]; then save || true; break; fi
            hm=$((10#$(TZ=America/New_York date +%H%M)))
            # Nasdaq movers scan: once an hour at xx:40-xx:59 New York time during the session, and once after the close
            if [ "$hm" -ge 940 ] && [ "$hm" -lt 1600 ] && [ $((hm % 100)) -ge 40 ] && [ "$mv_hour" != "$((hm / 100))" ]; then
              if gh workflow run movers.yml --ref main; then mv_hour=$((hm / 100)); else echo "::warning::Hareketliler taraması başlatılamadı"; fi
            fi
            # headlines (Yahoo + Seeking Alpha): every half hour, at xx:07-xx:36 and xx:37-xx:59
            m=$((hm % 100)); slot=""
            if [ "$m" -ge 37 ]; then slot="$((hm / 100))b"; elif [ "$m" -ge 7 ]; then slot="$((hm / 100))a"; fi
            if [ -n "$slot" ] && [ "$hm" -ge 937 ] && [ "$hm" -lt 1600 ] && [ "$slot" != "$news_slot" ]; then
              if gh workflow run watch.yml --ref main; then news_slot=$slot; else echo "::warning::Haber taraması başlatılamadı"; fi
            fi
            if [ "$hm" -ge 1610 ] || [ "$SECONDS" -ge "$deadline" ]; then
              save || true
              if [ "$hm" -ge 1610 ]; then
                gh workflow run movers.yml --ref main || echo "::warning::Kapanış taraması başlatılamadı"
                gh workflow run watch.yml --ref main || echo "::warning::Seans sonrası izleme başlatılamadı"   # loops until 20:00
              fi
              break
            fi
            sleep 300
          done
